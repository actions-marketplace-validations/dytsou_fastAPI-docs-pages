name: 'Upsert GitHub Pages deployments history'
description: >-
  Prune github-pages Deployments records for a ref (replace keeps newest;
  purge deletes all). Soft-fails on API errors. Never deletes protect-ref
  unless ref is that same branch.
author: 'dytsou'

branding:
  icon: 'trash'
  color: 'blue'

inputs:
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name (without owner)'
    required: true
  ref:
    description: 'Git ref / branch whose deployment records to upsert'
    required: true
  mode:
    description: 'replace (keep newest) or purge (delete all for ref)'
    required: true
  environment:
    description: 'Deployments environment name'
    required: false
    default: 'github-pages'
  protect-ref:
    description: >-
      Branch that must not be deleted unless ref matches it (e.g. default
      branch). Empty skips protection.
    required: false
    default: ''
  token:
    description: 'Token with deployments write'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Upsert deployments history
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        MODE: ${{ inputs.mode }}
        ENVIRONMENT: ${{ inputs.environment }}
        PROTECT_REF: ${{ inputs.protect-ref }}
      run: |
        set -euo pipefail
        args=(
          --owner "$OWNER"
          --repo "$REPO"
          --ref "$REF"
          --mode "$MODE"
          --environment "$ENVIRONMENT"
        )
        if [[ -n "${PROTECT_REF}" ]]; then
          args+=(--protect-ref "$PROTECT_REF")
        fi
        "${{ github.action_path }}/upsert.sh" "${args[@]}"

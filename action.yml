name: 'FastAPI Docs Pages'
description: 'Build static API docs (Swagger UI and/or Redocly) from OpenAPI for GitHub Pages.'
author: 'dytsou'

branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  openapi-path:
    description: 'Path to openapi.json'
    required: true
  out:
    description: 'Site root output directory'
    required: true
  title:
    description: 'HTML title for the docs page'
    required: false
    default: 'API docs'
  renderer:
    description: 'Docs renderer: swagger, redocly, or both'
    required: false
    default: 'swagger'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.renderer == 'redocly' || inputs.renderer == 'both'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'

    - name: Build site
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.action_path }}/build-site/build.sh" \
          --openapi "${{ inputs.openapi-path }}" \
          --out "${{ inputs.out }}" \
          --title "${{ inputs.title }}" \
          --renderer "${{ inputs.renderer }}"

name: Publish API docs to GitHub Pages

on:
  workflow_call:
    inputs:
      export-command:
        description: >-
          Shell command that writes openapi-path for the current tree.
          Env API_DOCS_TREE_ROOT and API_DOCS_WORKSPACE are available.
        type: string
        required: true
      openapi-path:
        description: OpenAPI file path relative to each tree root
        type: string
        required: false
        default: openapi.json
      working-directory:
        description: Directory (relative to tree root) where export-command runs
        type: string
        required: false
        default: "."
      setup-command:
        description: Optional one-time setup in the primary checkout (e.g. uv sync)
        type: string
        required: false
        default: ""
      title:
        description: HTML title for the docs page
        type: string
        required: false
        default: API docs
      renderer:
        description: Docs renderer — swagger, redocly, or both
        type: string
        required: false
        default: swagger
      pages-out:
        description: Directory uploaded as the Pages artifact
        type: string
        required: false
        default: _site

# Serial deploy via turnstyle (waits). Do not use workflow concurrency —
# GitHub cancels older pending runs in a concurrency group.

permissions:
  contents: read

jobs:
  build:
    name: Build API docs site
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Wait (turnstyle) + export can stack under PR bursts; prefer waiting
    # before build so the budget is not spent idle after a finished delta.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch default branch for main tree
        run: >
          git fetch --no-tags origin
          "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup (caller)
        if: inputs.setup-command != ''
        run: bash -euo pipefail -c "${{ inputs.setup-command }}"

      - name: Plan assemble mode
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          force_full=false
          mode=main
          pr=""
          pr_oid=""
          remove_pr=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode=full
            force_full=true
          elif [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "closed" ]]; then
            mode=remove-pr
            remove_pr="$PR_NUMBER"
            pr="$PR_NUMBER"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            mode=pr
            pr="$PR_NUMBER"
            pr_oid="$PR_SHA"
          else
            mode=main
          fi
          {
            echo "mode=$mode"
            echo "force_full=$force_full"
            echo "pr=$pr"
            echo "pr_oid=$pr_oid"
            echo "remove_pr=$remove_pr"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout fastAPI-docs-pages helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dytsou/fastAPI-docs-pages
          # Same commit as this reusable workflow (not the caller's SHA).
          ref: ${{ github.workflow_sha }}
          path: .api-docs-pages-src
          sparse-checkout: |
            assemble
            build-site
          sparse-checkout-cone-mode: true

      # Wait on other runs of this caller workflow (no queue-name). A custom
      # queue-name only matches runs whose title/name contains that substring,
      # which typical callers omit — leaving the wait a no-op.
      - name: Wait for Pages deploy queue
        uses: softprops/turnstyle@3805450be63b8c80577dc253e8c17e9132036df4 # v3.3.3
        with:
          poll-interval-seconds: 20
          same-branch-only: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch prior Pages artifact base
        id: base
        if: steps.plan.outputs.force_full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helpers=".api-docs-pages-src/assemble"
          chmod +x "$helpers/fetch_pages_base.sh" "$helpers/select_pages_artifact.sh"
          set +e
          "$helpers/fetch_pages_base.sh" \
            --repo "${{ github.repository }}" \
            --out _base \
            --exclude-run-id "${{ github.run_id }}"
          rc=$?
          set -e
          if [[ "$rc" -eq 3 ]]; then
            echo "has_base=false" >>"$GITHUB_OUTPUT"
            exit 0
          elif [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi
          echo "has_base=true" >>"$GITHUB_OUTPUT"

      - name: Build site delta
        if: >
          steps.plan.outputs.force_full != 'true' &&
          steps.base.outputs.has_base == 'true' &&
          steps.plan.outputs.mode != 'remove-pr'
        uses: dytsou/fastAPI-docs-pages/assemble@${{ github.workflow_sha }}
        with:
          out: _delta
          repo: ${{ github.repository }}
          export-command: ${{ inputs.export-command }}
          openapi-path: ${{ inputs.openapi-path }}
          working-directory: ${{ inputs.working-directory }}
          default-ref: origin/${{ github.event.repository.default_branch }}
          mode: ${{ steps.plan.outputs.mode }}
          pr: ${{ steps.plan.outputs.pr }}
          pr-oid: ${{ steps.plan.outputs.pr_oid }}
          require-pr: ${{ steps.plan.outputs.mode == 'pr' && steps.plan.outputs.pr || '' }}
          title: ${{ inputs.title }}
          renderer: ${{ inputs.renderer }}

      - name: Full assemble fallback
        id: full
        if: >
          steps.plan.outputs.force_full == 'true' ||
          steps.base.outputs.has_base != 'true'
        uses: dytsou/fastAPI-docs-pages/assemble@${{ github.workflow_sha }}
        with:
          out: ${{ inputs.pages-out }}
          repo: ${{ github.repository }}
          export-command: ${{ inputs.export-command }}
          openapi-path: ${{ inputs.openapi-path }}
          working-directory: ${{ inputs.working-directory }}
          default-ref: origin/${{ github.event.repository.default_branch }}
          mode: full
          omit-pr: ${{ steps.plan.outputs.remove_pr }}
          require-pr: ${{ steps.plan.outputs.mode == 'pr' && steps.plan.outputs.pr || '' }}
          title: ${{ inputs.title }}
          renderer: ${{ inputs.renderer }}

      - name: Merge delta into base
        if: >
          steps.plan.outputs.force_full != 'true' &&
          steps.base.outputs.has_base == 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          REMOVE_PR: ${{ steps.plan.outputs.remove_pr }}
          PAGES_OUT: ${{ inputs.pages-out }}
        run: |
          set -euo pipefail
          helpers=".api-docs-pages-src/assemble"
          chmod +x "$helpers/merge_site.sh"
          if [[ "$MODE" == "remove-pr" ]]; then
            "$helpers/merge_site.sh" --base _base --out "$PAGES_OUT" --remove-pr "$REMOVE_PR"
          else
            "$helpers/merge_site.sh" --base _base --out "$PAGES_OUT" --overlay _delta
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ inputs.pages-out }}
          # Default retention is 1 day; keep a merge base available longer.
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  pr-body:
    name: Upsert PR body API docs links
    needs: deploy
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Append or update API docs links at end of PR body
        uses: dytsou/fastAPI-docs-pages/upsert-pr-body@v1
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pr-number: ${{ github.event.pull_request.number }}
          removed: ${{ github.event.action == 'closed' }}

  # replace on push/dispatch and PR open/sync (same head ref only).
  # PR closed: purge that head ref; protect-ref keeps the default branch safe.
  upsert-deployments:
    name: Upsert deployments history
    needs: deploy
    if: >
      needs.deploy.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Upsert deployments for this ref
        uses: dytsou/fastAPI-docs-pages/upsert-deployments@v1
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.ref
              || github.ref_name
            }}
          mode: >-
            ${{
              github.event_name == 'pull_request' && github.event.action == 'closed'
              && 'purge'
              || 'replace'
            }}
          protect-ref: ${{ github.event.repository.default_branch }}

name: 'Assemble API docs Pages site'
description: >-
  Build main /docs/ plus open same-repo PR previews from per-ref OpenAPI exports
author: 'dytsou'

branding:
  icon: 'layers'
  color: 'blue'

inputs:
  out:
    description: 'Output directory for the Pages site'
    required: true
  repo:
    description: 'GitHub repository in owner/name form'
    required: true
  export-command:
    description: >-
      Shell command that writes openapi-path for the current tree.
      Runs with cwd = tree/working-directory. Env API_DOCS_TREE_ROOT and
      API_DOCS_WORKSPACE are set.
    required: true
  openapi-path:
    description: 'OpenAPI file path relative to the tree root'
    required: false
    default: 'openapi.json'
  working-directory:
    description: 'Directory (relative to tree root) where export-command runs'
    required: false
    default: '.'
  default-ref:
    description: 'Git ref used for the main docs tree'
    required: false
    default: 'origin/main'
  omit-pr:
    description: 'PR number to omit (e.g. when the PR just closed)'
    required: false
    default: ''
  title:
    description: 'HTML title for the docs page'
    required: false
    default: 'API docs'
  renderer:
    description: 'Docs renderer: swagger, redocly, or both'
    required: false
    default: 'swagger'
  token:
    description: 'Token for listing open PRs via gh'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.renderer == 'redocly' || inputs.renderer == 'both'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Assemble site
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        API_DOCS_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        args=(
          --out "${{ inputs.out }}"
          --repo "${{ inputs.repo }}"
          --export-command "${{ inputs.export-command }}"
          --openapi-path "${{ inputs.openapi-path }}"
          --working-directory "${{ inputs.working-directory }}"
          --default-ref "${{ inputs.default-ref }}"
          --title "${{ inputs.title }}"
          --renderer "${{ inputs.renderer }}"
        )
        if [[ -n "${{ inputs.omit-pr }}" ]]; then
          args+=(--omit-pr "${{ inputs.omit-pr }}")
        fi
        "${{ github.action_path }}/assemble.sh" "${args[@]}"

name: 'Build OpenAPI static site'
description: 'Build a static API docs site (Swagger UI and/or Redocly) from OpenAPI JSON'
author: 'dytsou'

branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  openapi-path:
    description: 'Path to openapi.json'
    required: true
  out:
    description: 'Site root output directory'
    required: true
  title:
    description: 'HTML title for the docs page'
    required: false
    default: 'API docs'
  renderer:
    description: 'Docs renderer: swagger, redocly, or both'
    required: false
    default: 'swagger'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.renderer == 'redocly' || inputs.renderer == 'both'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Build site
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.action_path }}/build.sh" \
          --openapi "${{ inputs.openapi-path }}" \
          --out "${{ inputs.out }}" \
          --title "${{ inputs.title }}" \
          --renderer "${{ inputs.renderer }}"
